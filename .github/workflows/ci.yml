name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --no-audit --no-fund

      - name: Type check + build frontend
        run: npm run build

      - name: Test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  # zip พร้อมอัปโหลดขึ้น shared host — ดาวน์โหลดได้จากหน้า Actions ของ run นั้น
  release:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: bash deploy/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: devtrin-release
          path: build/devtrin-*.zip
          retention-days: 30

      # push tag v1.0.1 → สร้าง GitHub Release ที่ปุ่ม "อัปเดต" ใน /_maintenance ดึงไปติดตั้ง
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "v$(tr -d '[:space:]' < VERSION)" != "$TAG" ]; then
            echo "tag $TAG ไม่ตรงกับไฟล์ VERSION" >&2; exit 1
          fi
          cp build/devtrin-*.zip "build/devtrin-$TAG.zip"
          gh release create "$TAG" "build/devtrin-$TAG.zip" --title "Devtrin $TAG" --generate-notes
