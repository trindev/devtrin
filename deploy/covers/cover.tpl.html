<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{position:relative;background:#0b0b0d;font-family:-apple-system,'Helvetica Neue',sans-serif}
.glow1{position:absolute;width:1300px;height:1300px;left:-300px;top:-520px;border-radius:50%;background:radial-gradient(closest-side,{{ACCENT}}cc,transparent 70%);filter:blur(10px)}
.glow2{position:absolute;width:1000px;height:1000px;right:-360px;bottom:-460px;border-radius:50%;background:radial-gradient(closest-side,{{ACCENT}}88,transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgb(255 255 255/.05) 1px,transparent 1px),linear-gradient(to bottom,rgb(255 255 255/.05) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 40% 40%,#000 25%,transparent 75%)}
.browser{position:absolute;left:110px;top:120px;width:1180px;border-radius:18px;overflow:hidden;background:#1a1a1f;
  box-shadow:0 0 0 1px rgb(255 255 255/.10),0 50px 100px -20px rgb(0 0 0/.65),0 30px 60px -30px rgb(0 0 0/.5)}
.bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 18px;background:#202026;border-bottom:1px solid rgb(255 255 255/.06)}
.dot{width:12px;height:12px;border-radius:50%}
.url{margin-left:22px;flex:1;max-width:520px;height:28px;border-radius:8px;background:rgb(255 255 255/.07);color:rgb(255 255 255/.7);font-size:14px;display:flex;align-items:center;padding:0 14px;gap:8px}
.url b{width:10px;height:10px;border-radius:50%;background:{{ACCENT}}}
.shot{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.phone{position:absolute;right:120px;bottom:-70px;width:330px;height:714px;border-radius:52px;padding:12px;background:#111114;
  box-shadow:0 0 0 2px rgb(255 255 255/.14),0 60px 120px -20px rgb(0 0 0/.8);transform:rotate(4deg)}
.phone img{width:100%;height:100%;border-radius:41px;object-fit:cover;object-position:top;display:block}
.notch{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:20px;background:#000}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
<div class="browser"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
<span class="url"><b></b>{{HOST}}</span></div><img class="shot" src="{{DESKTOP}}"></div>
<div class="phone"><img src="{{MOBILE}}"><span class="notch"></span></div>
</body></html>
